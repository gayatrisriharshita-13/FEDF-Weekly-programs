<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style11.css">
</head>
<body>
    <div class="container">
        <h2>Digital Clock</h2>
        <div id="clock-container">
            <span id="hour">00</span>:
            <span id="min">00</span>:
            <span id="sec">00</span>
        </div>
        <hr>
        <button onclick="useDOM()">Update with Standard DOM</button>
        <button onclick="useVDOM()">Update with Virtual DOM</button>
        <p id="status">Click a button to start the clock!</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
